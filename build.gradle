
plugins {
    id 'base'
}

allprojects {
    group = 'com.example'
    version = '1.0.0'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    dependencies {
        testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
            testLogging {
               events "passed", "failed", "skipped"
               showStandardStreams = true
    }
}
